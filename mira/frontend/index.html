<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14532d" />
    <title>MIRA — Mitra for Intelligence, Risk &amp; Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts load async so they never block first paint (swap-in when ready) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <!-- static shell: paints immediately, replaced when React mounts -->
      <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#14532d,#0f3d22);color:#faf7f0;font-family:Georgia,'Noto Sans Devanagari',serif;text-align:center;padding:24px">
        <p style="font-size:52px;font-weight:700;margin:0;letter-spacing:0.5px">MIRA <span style="font-size:30px">मीरा</span></p>
        <p style="font-size:13px;margin:0;opacity:0.75;text-transform:uppercase;letter-spacing:2px">Mitra for Intelligence, Risk &amp; Analytics</p>
        <p style="font-size:16px;margin:6px 0 0;opacity:0.9;max-width:420px">AI cash-flow prediction &amp; early risk flagging for rural micro enterprises</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
